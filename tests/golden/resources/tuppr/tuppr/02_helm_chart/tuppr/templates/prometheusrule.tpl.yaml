apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/instance: tuppr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: tuppr
    app.kubernetes.io/version: 0.2.9
    helm.sh/chart: tuppr-0.2.9
  name: tuppr
  namespace: syn-tuppr
spec:
  groups:
    - name: tuppr.talosupgrade
      rules:
        - alert: TalosUpgradeNodeFailed
          annotations:
            description: Talos upgrade {{ $labels.name }} has {{ $value }} node(s)
              that failed to upgrade. The upgrade has stopped and requires manual
              intervention (e.g. remove the failed nodes from status or fix the underlying
              issue and reset with the reset annotation).
            summary: Talos upgrade {{ $labels.name }} has {{ $value }} failed node(s)
          expr: tuppr_talos_upgrade_nodes_failed > 0
          for: 1m
          labels:
            severity: critical
            syn: 'true'
            syn_component: tuppr
            syn_team: schedar
        - alert: TalosUpgradeFailed
          annotations:
            description: Talos upgrade {{ $labels.name }} has entered the Failed phase.
              Check controller logs and node conditions for details.
            summary: Talos upgrade {{ $labels.name }} is in Failed phase
          expr: tuppr_talos_upgrade_phase{phase="Failed"} == 1
          for: 1m
          labels:
            severity: critical
            syn: 'true'
            syn_component: tuppr
            syn_team: schedar
        - alert: TalosUpgradeStuck
          annotations:
            description: Talos upgrade {{ $labels.name }} has been in the {{ $labels.phase
              }} phase for more than 1h. Check the upgrade job and target node for
              errors.
            summary: Talos upgrade {{ $labels.name }} stuck in {{ $labels.phase }}
              phase
          expr: tuppr_talos_upgrade_phase{phase=~"Upgrading|Rebooting|Draining|HealthChecking"}
            == 1
          for: 1h
          labels:
            severity: warning
            syn: 'true'
            syn_component: tuppr
            syn_team: schedar
    - name: tuppr.kubernetesupgrade
      rules:
        - alert: KubernetesUpgradeFailed
          annotations:
            description: Kubernetes upgrade {{ $labels.name }} has entered the Failed
              phase. Check controller logs and the upgrade job for details.
            summary: Kubernetes upgrade {{ $labels.name }} is in Failed phase
          expr: tuppr_kubernetes_upgrade_phase{phase="Failed"} == 1
          for: 1m
          labels:
            severity: critical
            syn: 'true'
            syn_component: tuppr
            syn_team: schedar
        - alert: KubernetesUpgradeStuck
          annotations:
            description: Kubernetes upgrade {{ $labels.name }} has been in the {{
              $labels.phase }} phase for more than 45 minutes. Check the upgrade job
              and control-plane nodes for errors.
            summary: Kubernetes upgrade {{ $labels.name }} stuck in {{ $labels.phase
              }} phase
          expr: tuppr_kubernetes_upgrade_phase{phase=~"Upgrading|HealthChecking"}
            == 1
          for: 45m
          labels:
            severity: warning
            syn: 'true'
            syn_component: tuppr
            syn_team: schedar
    - name: tuppr.blocked
      rules:
        - alert: TupprUpgradeBlocked
          annotations:
            description: '{{ $labels.upgrade_type }} upgrade {{ $labels.name }} has
              been blocked with reason {{ $labels.reason }} for more than 30m. Check
              the upgrade''s status conditions and message.'
            summary: '{{ $labels.upgrade_type | title }} upgrade {{ $labels.name }}
              blocked ({{ $labels.reason }})'
          expr: tuppr_upgrade_progressing{reason=~"Waiting.*|Suspended"} == 0
          for: 30m
          labels:
            severity: warning
            syn: 'true'
            syn_component: tuppr
            syn_team: schedar
    - name: tuppr.jobs
      rules:
        - alert: UpgradeJobRunningTooLong
          annotations:
            description: A {{ $labels.upgrade_type }} upgrade job has been active
              for more than 1 hour, which exceeds the expected duration. The job may
              be stuck. Check the job logs in the controller namespace.
            summary: '{{ $labels.upgrade_type | title }} upgrade job running for over
              1 hour'
          expr: tuppr_upgrade_jobs_active > 0
          for: 1h
          labels:
            severity: warning
            syn: 'true'
            syn_component: tuppr
            syn_team: schedar
    - name: tuppr.operator
      rules:
        - alert: TupprOperatorAbsent
          annotations:
            description: No tuppr operator instance has reported metrics for 5 minutes.
              Upgrade alerts in this group will not fire while the operator is down.
              Check the controller deployment and ServiceMonitor.
            summary: tuppr operator is not reporting metrics
          expr: absent(tuppr_build_info)
          for: 5m
          labels:
            severity: critical
            syn: 'true'
            syn_component: tuppr
            syn_team: schedar
        - alert: TupprUpgradeFailureRate
          annotations:
            description: tuppr recorded more than 2 failed upgrade completions in
              the last hour. Inspect recent TalosUpgrade/KubernetesUpgrade objects
              and the controller logs.
            summary: tuppr has recorded multiple upgrade failures
          expr: sum(increase(tuppr_upgrades_completed_total{result="failure"}[1h]))
            > 2
          for: 10m
          labels:
            severity: warning
            syn: 'true'
            syn_component: tuppr
            syn_team: schedar
